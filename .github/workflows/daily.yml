name: Daily Commit

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Update progress log
        run: |
          echo "Update: $(date +'%Y-%m-%d %H:%M:%S')" >> progress.log

      - name: Commit & Push
        run: |
          git config user.name "cristian-bravo"
          git config user.email "ktc1cristian@gmail.com"

          git add -f progress.log
          git commit -m "chore(log): daily update $(date +'%Y-%m-%d')" || exit 0
          git push
